<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>
<iframe id="f" src="/" style="width:1100px;height:1400px;border:0"></iframe><pre id="o"></pre>
<script>
document.getElementById('f').onload=function(){
  var w=this.contentWindow,d=this.contentDocument;
  setTimeout(function(){
    var inp=d.getElementById('groupInput');
    var set=Object.getOwnPropertyDescriptor(w.HTMLInputElement.prototype,'value').set;
    set.call(inp,'8101-оз'); inp.dispatchEvent(new w.Event('input',{bubbles:true}));
    d.getElementById('dateFrom').value='2026-10-01';
    d.getElementById('dateTo').value='2026-10-03';
    d.getElementById('searchForm').dispatchEvent(new w.Event('submit',{bubbles:true,cancelable:true}));
    setTimeout(function(){
      document.getElementById('o').textContent='LESSONS='+d.querySelectorAll('.lesson').length+
        ' HEAD='+(d.querySelector('.result-head')?d.querySelector('.result-head').textContent:'none')+
        ' FIRST='+(d.querySelector('.lesson')?d.querySelector('.lesson').textContent.replace(/\s+/g,' ').slice(0,80):'');
    },2500);
  },1500);
};
</script></body></html>
